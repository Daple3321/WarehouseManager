services:
  warehouse-db:
    image: postgres:16-alpine
    container_name: warehouse_postgres_db
    restart: always
    environment:
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: SomeBigPassword123
      POSTGRES_DB: warehouse_management_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_user -d warehouse_management_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  warehouse-redis:
    image: redis:8-alpine
    container_name: warehouse_redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  warehouse-kafka:
    image: apache/kafka:latest
    container_name: warehouse_kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://warehouse-kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@warehouse-kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  warehouse-api:
    image: warehouse-manager:latest
    user: root
    container_name: warehouse_manager_api
    build:
      context: ..
      dockerfile: WarehouseManager/Dockerfile
    restart: always
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=warehouse-db;Port=5432;Database=warehouse_management_db;Username=warehouse_user;Password=SomeBigPassword123
      ConnectionStrings__RedisCache: warehouse-redis:6379
      Kafka__BootstrapServers: warehouse-kafka:9092
      XDG_DATA_HOME: /app/data
    depends_on:
      warehouse-db:
        condition: service_healthy
      warehouse-kafka:
        condition: service_healthy
    volumes:
      - api_data:/app/data

volumes:
  postgres_data:
  api_data:
  redis_data:
  kafka_data: